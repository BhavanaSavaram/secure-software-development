<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vulnerable Calculator (eval())</title>
  <link rel="stylesheet" href="/shared/styles.css" />
</head>
<body>
  <div class="card">
    <span class="badge vuln">Vulnerable</span>
    <h1>Calculator</h1>
    <p class="hint">
      Type an expression and submit — the server evaluates it with
      <code>eval()</code>, which runs any JavaScript, not just math. Try:
      <code>2 + 3 * 4</code> (normal use),
      <code>INTERNAL_API_KEY</code> (leaks a server-side secret), or
      <code>process.version</code> (reads Node internals).
    </p>

    <form class="try-it" id="calc-form" data-endpoint="/vulnerable/calculate">
      <label class="field-label visually-hidden" for="expression">Expression</label>
      <input type="text" id="expression" name="expression" placeholder="Expression..." autocomplete="off" />
      <button type="submit">Calculate</button>
    </form>

    <div class="result">
      <pre id="result">(no result yet)</pre>
    </div>
  </div>

  <!--
    VULNERABILITY 2a — see src/routes/vulnerable.js POST /calculate and
    Project-2-Report.pdf. This page is just a form + fetch() wrapper
    (public/shared/calculator.js) around that API; the vulnerability itself
    lives entirely server-side, in the eval(expression) call.
  -->
  <script src="/shared/calculator.js"></script>
</body>
</html>
