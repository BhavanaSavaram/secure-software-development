# ---------------------------------------------------------------------------
# Spring Boot application setup
# Spring Boot reads this file automatically at startup (no code wires it
# up) and applies every setting below before the embedded server starts.
# ---------------------------------------------------------------------------

# Shown in startup logs / used by Spring Boot Actuator if it's ever added.
spring.application.name=secureapp

# The embedded Tomcat server listens on this port. 8443 (rather than the
# Spring Boot default 8080) is the conventional port number for HTTPS
# traffic in dev environments, mirroring how 443 is conventional for
# HTTPS in production.
server.port=8443

# ---------------------------------------------------------------------------
# HTTPS / TLS configuration (the KeyStore piece of the rubric)
# The keystore file itself is generated by scripts/generate-keystore.sh
# and is NOT committed to version control (see .gitignore) -- a keystore
# is a generated secret artifact (it contains a private key), not source
# code, so it doesn't belong in a repository.
#
# The password below is a placeholder for LOCAL DEVELOPMENT ONLY. In a
# real deployment, set the SERVER_SSL_KEY_STORE_PASSWORD environment
# variable (or wire in a secrets manager) instead of relying on the
# "changeit" fallback -- never commit a real keystore password to source
# control.
# ---------------------------------------------------------------------------

# Turns on TLS for the embedded server. Without this, server.port above
# would just be a plain HTTP port.
server.ssl.enabled=true

# Where to find the keystore. "classpath:" means "look inside the
# compiled application's classpath" -- because keystore.p12 lives under
# src/main/resources, Maven packages it into the final jar automatically,
# so this path resolves both when running via `mvn spring-boot:run` and
# from the built jar.
server.ssl.key-store=classpath:keystore.p12

# PKCS12 is the modern, cross-platform keystore format (replacing the
# older, Java-only JKS format) -- this must match the -storetype value
# used when the keystore was generated in generate-keystore.sh.
server.ssl.key-store-type=PKCS12

# ${SERVER_SSL_KEY_STORE_PASSWORD:changeit} is Spring's placeholder
# syntax: use the environment variable if it's set, otherwise fall back
# to the literal default after the colon. "changeit" is the conventional
# placeholder password used for local/self-signed certs.
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:changeit}

# Must match the -alias used when the certificate/key pair was generated
# -- a keystore file can hold multiple entries, so the alias picks which
# one Tomcat should actually serve.
server.ssl.key-alias=secureapp

server.ssl.protocol=TLS

# Only allow the two current, unbroken TLS versions. Older protocols
# (SSLv3, TLS 1.0/1.1) have known cryptographic weaknesses and are
# excluded here rather than left available for backward compatibility.
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Belt-and-suspenders alongside SecurityConfig's requiresSecure() rule:
# tells Spring Boot itself that plain HTTP is never acceptable for this
# app.
security.require-ssl=true

# ---------------------------------------------------------------------------
# Database connection
# H2 is an in-memory database used here so the project runs with zero
# external setup for grading/demo purposes. Swapping to Postgres/MySQL in
# a real deployment only means changing the four spring.datasource.*
# lines below -- the entity (AppUser), repository (AppUserRepository),
# and controller (UserController) code never needs to change, because
# they all go through JPA/Hibernate rather than a specific database's
# SQL dialect.
# ---------------------------------------------------------------------------

# DB_CLOSE_ON_EXIT=FALSE keeps the in-memory database alive for the life
# of the JVM process even if the last connection in the pool is briefly
# closed -- without it, H2's default behavior can wipe all data the
# moment the connection pool recycles a connection.
spring.datasource.url=jdbc:h2:mem:secureappdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa

# Same environment-variable-with-fallback pattern as the keystore
# password above; empty by default because the local H2 instance has no
# password set.
spring.datasource.password=${DB_PASSWORD:}

# "update": Hibernate compares AppUser's @Column/@Entity annotations
# against the existing schema at startup and adds any missing
# tables/columns, but never drops or destructively alters existing data.
# (In a real production deployment you would typically disable this and
# use versioned migration scripts, e.g. Flyway/Liquibase, instead.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# Keep generated SQL out of the logs -- avoids incidentally logging
# query parameter values (which, depending on the query, could include
# things derived from user input) in plaintext log files.
spring.jpa.show-sql=false

# The H2 web console is a full database browser exposed over HTTP -- it
# has no place being reachable in anything beyond a throwaway local
# sandbox, so it stays off even in this demo configuration.
spring.h2.console.enabled=false

# ---------------------------------------------------------------------------
# Error responses: never leak internals to a client
# By default, Spring Boot's error responses can include the exception
# message and even a full stack trace, which is useful for local
# debugging but is exactly the kind of internal detail (table names,
# library versions, file paths) an attacker doing reconnaissance for an
# injection attack would want. All three are disabled below regardless
# of environment.
# ---------------------------------------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
